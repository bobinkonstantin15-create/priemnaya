<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровая приёмная</title>
<style>
:root{
  --bg:#f3f6fa; --card:#fff; --ink:#1b2430; --muted:#5e6b7a; --line:#dde3ea;
  --brand:#0d5bd7; --brand-2:#0a47a9; --brand-soft:#e7f0ff;
  --ok:#14804a; --ok-soft:#e3f5ea; --warn:#a15c00; --warn-soft:#fff2dc; --err:#c62828;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hdr{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0d5bd7,#4a8cff);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:10px;color:var(--ink);font-size:15px}
nav a:hover{background:var(--bg);text-decoration:none}
nav a.on{background:var(--brand-soft);color:var(--brand)}
.burger{display:none;margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer}
@media (max-width:760px){
  .burger{display:block}
  nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line)}
  nav.open{display:flex}
}

main{padding:28px 0 56px;min-height:70vh}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:22px;margin:32px 0 14px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* hero */
.hero{background:linear-gradient(135deg,#0d5bd7 0%,#2f7bff 100%);color:#fff;border-radius:20px;padding:36px 32px;position:relative;overflow:hidden}
.hero h1{font-size:34px;max-width:640px}
.hero p{opacity:.92;max-width:600px;margin:0 0 20px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.search{display:flex;gap:8px;max-width:620px;position:relative;z-index:1}
.search input{flex:1;border:0;border-radius:12px;padding:14px 16px;font-size:16px;min-width:0}
.search button{border:0;border-radius:12px;padding:0 20px;background:#0a2f6e;color:#fff;font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.chips a{background:rgba(255,255,255,.16);color:#fff;padding:6px 12px;border-radius:999px;font-size:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
a.card{display:block;color:var(--ink);transition:box-shadow .15s,transform .15s}
a.card:hover{text-decoration:none;box-shadow:0 8px 24px rgba(13,91,215,.12);transform:translateY(-2px)}
.ico{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.cat-cards .card{padding:22px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.badge.new{background:var(--brand-soft);color:var(--brand)}
.badge.work{background:var(--warn-soft);color:var(--warn)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.badge.off{background:#eee;color:#777}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs a{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:14px}
.tabs a.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs a:hover{text-decoration:none}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.steps .card b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;margin-bottom:10px}

/* forms */
.form{max-width:760px}
fieldset{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:20px;margin:0 0 16px}
legend{font-weight:700;padding:0 6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
label .req{color:var(--err)}
.f{margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #c9d2dd;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.bad{border-color:var(--err)!important;background:#fff6f6}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;margin:10px 0}
.check input{width:18px;height:18px;margin-top:3px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-2);text-decoration:none}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:#fff;color:var(--err);border:1px solid #f0c9c9}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.crumbs{font-size:14px;margin-bottom:14px;color:var(--muted)}

/* list */
.item{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item + .item{margin-top:10px}
.empty{text-align:center;padding:40px 20px}

/* document sheet */
.sheet{background:#fff;max-width:800px;margin:0 auto;padding:48px 56px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:6px;font-family:"Times New Roman",Georgia,serif;font-size:16px;line-height:1.55}
.sheet .top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1b2430;padding-bottom:12px;margin-bottom:22px;font-size:14px}
.sheet h2{text-align:center;font-size:20px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.sheet .num{text-align:center;margin-bottom:24px}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0}
.sheet td{border:1px solid #ccc;padding:6px 10px;vertical-align:top}
.sheet td:first-child{width:38%;color:#444}
.sheet .quote{white-space:pre-wrap;border-left:3px solid #ccc;padding:4px 0 4px 14px;margin:10px 0}
.sign{display:flex;gap:20px;align-items:center;margin-top:36px;border:2px solid var(--brand);border-radius:10px;padding:14px 16px;font-family:system-ui,sans-serif;font-size:13px;color:#0a2f6e}
.sign svg{width:96px;height:96px;flex:none}
.sign b{display:block;font-size:14px;margin-bottom:4px}
.doc-bar{max-width:800px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media (max-width:640px){.sheet{padding:24px 18px}.sheet .top{flex-direction:column;gap:4px}.sign{flex-direction:column;align-items:flex-start}}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 26px}
.tl li::before{content:"";position:absolute;left:6px;top:7px;width:10px;height:10px;border-radius:50%;background:#c9d2dd}
.tl li.on::before{background:var(--ok)}
.tl li::after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(15,25,40,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:420px;width:100%;padding:26px}
.code-in{font-size:28px;letter-spacing:12px;text-align:center;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px)}
#toast div{background:#1b2430;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

footer{border-top:1px solid var(--line);background:#fff;padding:24px 0;font-size:14px;color:var(--muted)}

@media print{
  header,footer,.noprint,#toast{display:none!important}
  body{background:#fff}
  main{padding:0}
  .sheet{box-shadow:none;border:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <a class="logo" href="#/"><i>Ц</i>Цифровая приёмная</a>
    <button class="burger" aria-label="Меню" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    <nav>
      <a href="#/services">Услуги</a>
      <a href="#/my">Мои заявки</a>
      <a href="#/verify">Проверить документ</a>
      <a href="#/profile">Профиль</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <b>Цифровая приёмная</b> — учебный демонстрационный проект. Не является официальным государственным порталом.
    Все данные хранятся только в вашем браузере и никуда не отправляются.
  </div>
</footer>
<div id="toast"></div>

<script>
/* ---------- данные ---------- */
const CATS = {
  appeals: {t:'Обращения', i:'✉️', d:'Жалобы, предложения и запросы в органы власти'},
  certs:   {t:'Справки',   i:'📄', d:'Справки формируются мгновенно в электронном виде'},
  apps:    {t:'Заявления', i:'📝', d:'Заявления на выплаты, запись и уведомления'}
};
const AGENCIES = ['Администрация города','Департамент ЖКХ','Департамент транспорта','Департамент образования','Департамент здравоохранения','Департамент социальной защиты'];

const SERVICES = [
  {id:'appeal', cat:'appeals', i:'✉️', t:'Электронное обращение в орган власти', d:'Направьте письменное обращение без визита и бумажного письма', days:30,
   fields:[{n:'agency',l:'Адресат',t:'select',o:AGENCIES},{n:'topic',l:'Тема обращения',t:'text'},{n:'text',l:'Текст обращения',t:'textarea',h:'Опишите суть вопроса. Минимум 20 символов.'}]},
  {id:'complaint', cat:'appeals', i:'⚠️', t:'Жалоба на качество услуг', d:'Сообщите о нарушениях в работе учреждения или организации', days:15,
   fields:[{n:'agency',l:'Куда направить',t:'select',o:AGENCIES},{n:'org',l:'Организация, на которую жалуетесь',t:'text'},{n:'date',l:'Дата нарушения',t:'date'},{n:'text',l:'Описание ситуации',t:'textarea'}]},
  {id:'proposal', cat:'appeals', i:'🌳', t:'Предложение по благоустройству', d:'Предложите идею для двора, улицы или парка', days:30,
   fields:[{n:'place',l:'Адрес или место',t:'text'},{n:'kind',l:'Тип предложения',t:'select',o:['Озеленение','Освещение','Детская площадка','Дороги и тротуары','Другое']},{n:'text',l:'Суть предложения',t:'textarea'}]},
  {id:'info', cat:'appeals', i:'❓', t:'Запрос информации', d:'Запросите сведения о деятельности органа власти', days:30,
   fields:[{n:'agency',l:'Адресат',t:'select',o:AGENCIES},{n:'text',l:'Какая информация нужна',t:'textarea'}]},

  {id:'residence', cat:'certs', i:'🏠', t:'Справка о регистрации по месту жительства', d:'Подтверждает адрес постоянной регистрации', instant:true,
   fields:[{n:'regaddr',l:'Адрес регистрации',t:'text'},{n:'since',l:'Дата регистрации',t:'date'},{n:'purpose',l:'Для предоставления в',t:'text',h:'Например: по месту требования'}],
   body:(it,v)=>`<p>Настоящая справка выдана гражданину(ке) <b>${v.fio}</b>, ${v.birth} г.&nbsp;р., в том, что он(а) зарегистрирован(а) по месту жительства по адресу: <b>${v.regaddr}</b> с ${v.since}.</p><p>Справка выдана для предоставления: ${v.purpose}.</p>`},
  {id:'family', cat:'certs', i:'👪', t:'Справка о составе семьи', d:'Сведения о лицах, зарегистрированных совместно с заявителем', instant:true,
   fields:[{n:'regaddr',l:'Адрес регистрации',t:'text'},{n:'members',l:'Члены семьи',t:'textarea',h:'Каждый с новой строки: ФИО, степень родства, год рождения'},{n:'purpose',l:'Для предоставления в',t:'text'}],
   body:(it,v)=>`<p>Дана <b>${v.fio}</b>, ${v.birth} г.&nbsp;р., зарегистрированному(ой) по адресу: ${v.regaddr}, в том, что совместно с ним(ней) зарегистрированы:</p><div class="quote">${v.members}</div><p>Справка выдана для предоставления: ${v.purpose}.</p>`},
  {id:'debt', cat:'certs', i:'✅', t:'Справка об отсутствии задолженности за ЖКУ', d:'Подтверждает отсутствие долга по оплате жилищно-коммунальных услуг', instant:true,
   fields:[{n:'account',l:'Номер лицевого счёта',t:'text'},{n:'regaddr',l:'Адрес помещения',t:'text'},{n:'period',l:'На дату',t:'date'}],
   body:(it,v)=>`<p>Настоящим подтверждается, что по лицевому счёту <b>№ ${v.account}</b> (адрес: ${v.regaddr}), открытому на имя <b>${v.fio}</b>, по состоянию на ${v.period} <b>задолженность по оплате жилищно-коммунальных услуг отсутствует</b>.</p>`},
  {id:'study', cat:'certs', i:'🎓', t:'Справка об обучении', d:'Подтверждает, что вы обучаетесь в образовательной организации', instant:true,
   fields:[{n:'org',l:'Образовательная организация',t:'text'},{n:'course',l:'Курс / класс',t:'text'},{n:'form',l:'Форма обучения',t:'select',o:['Очная','Очно-заочная','Заочная']},{n:'purpose',l:'Для предоставления в',t:'text'}],
   body:(it,v)=>`<p>Дана <b>${v.fio}</b>, ${v.birth} г.&nbsp;р., в том, что он(а) действительно обучается в организации «${v.org}», ${v.course}, форма обучения — ${v.form.toLowerCase()}.</p><p>Справка выдана для предоставления: ${v.purpose}.</p>`},

  {id:'benefit', cat:'apps', i:'💳', t:'Заявление на социальную выплату', d:'Подайте заявление на пособие или компенсацию', days:10,
   fields:[{n:'kind',l:'Вид выплаты',t:'select',o:['Единовременное пособие при рождении ребёнка','Компенсация оплаты ЖКУ','Ежемесячная выплата на ребёнка','Материальная помощь']},{n:'way',l:'Способ получения',t:'select',o:['На счёт, указанный при личном визите в банк','Почтовым переводом']},{n:'text',l:'Дополнительные сведения',t:'textarea',opt:true}]},
  {id:'kindergarten', cat:'apps', i:'🧸', t:'Запись в детский сад', d:'Постановка ребёнка в очередь в дошкольное учреждение', days:7,
   fields:[{n:'child',l:'ФИО ребёнка',t:'text'},{n:'cbirth',l:'Дата рождения ребёнка',t:'date'},{n:'district',l:'Желаемый район',t:'select',o:['Центральный','Северный','Южный','Западный','Восточный']},{n:'start',l:'Желаемая дата зачисления',t:'date'}]},
  {id:'event', cat:'apps', i:'📣', t:'Уведомление о проведении мероприятия', d:'Уведомите о проведении публичного или дворового мероприятия', days:3,
   fields:[{n:'title',l:'Название мероприятия',t:'text'},{n:'place',l:'Место проведения',t:'text'},{n:'date',l:'Дата проведения',t:'date'},{n:'people',l:'Ожидаемое число участников',t:'number'}]},
  {id:'parking', cat:'apps', i:'🅿️', t:'Резидентное парковочное разрешение', d:'Разрешение на парковку рядом с домом', days:5,
   fields:[{n:'car',l:'Госномер автомобиля',t:'text'},{n:'regaddr',l:'Адрес регистрации',t:'text'}]}
];
const svc = id => SERVICES.find(s => s.id === id);

/* ---------- хранилище ---------- */
const KEY = 'cp_portal_v1';
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) } catch(e) {}
if (!db || !db.items) db = {profile:{}, items:[]};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)) } catch(e) {} }

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('ru-RU') : '';
const fmtDT = d => new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg, ms=3500){ const el=document.createElement('div'); el.innerHTML=msg; $('#toast').append(el); setTimeout(()=>el.remove(), ms); return el; }
function fnv(str){ let h=0x811c9dc5; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0 } return h.toString(16).padStart(8,'0') }
function makeCode(it){ const s=JSON.stringify([it.num,it.service,it.created,it.data]); return (fnv(s)+fnv('x'+s)).slice(0,12).toUpperCase().match(/.{4}/g).join('-') }
function addDays(ts, n){ return ts + n*864e5 }

const APPLICANT = [
  {n:'last',l:'Фамилия',t:'text'},{n:'first',l:'Имя',t:'text'},{n:'middle',l:'Отчество',t:'text',opt:true},
  {n:'birth',l:'Дата рождения',t:'date'},{n:'email',l:'Электронная почта',t:'email'},{n:'phone',l:'Телефон',t:'tel',h:'+7 (900) 000-00-00'}
];
const fio = d => [d.last,d.first,d.middle].filter(Boolean).join(' ');

function status(it){
  if (it.withdrawn) return {k:'off', t:'Отозвано', step:-1};
  const s = svc(it.service), m = (Date.now()-it.created)/60000;
  if (s.cat==='certs') return {k:'done', t:'Документ готов', step:2};
  const names = s.cat==='appeals' ? ['Зарегистрировано','На рассмотрении','Ответ направлен'] : ['Принято','Проверка сведений','Одобрено'];
  const step = m<2 ? 0 : m<5 ? 1 : 2;   // демо: статус меняется со временем
  return {k:['new','work','done'][step], t:names[step], step, names};
}

/* ---------- роутинг ---------- */
function route(){
  const [path, q] = location.hash.slice(1).split('?');
  const parts = (path||'/').split('/').filter(Boolean);
  const params = new URLSearchParams(q||'');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', ('#/'+parts[0]) === a.getAttribute('href')));
  $('nav').classList.remove('open');
  const r = parts[0];
  if (!r) home();
  else if (r==='services') catalog(params.get('cat'), params.get('q')||'');
  else if (r==='service') serviceForm(parts[1]);
  else if (r==='my') myList();
  else if (r==='doc') docView(decodeURIComponent(parts[1]));
  else if (r==='verify') verify(params.get('n')||'', params.get('c')||'');
  else if (r==='profile') profile();
  else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route);

/* ---------- страницы ---------- */
function svcCard(s){
  return `<a class="card" href="#/service/${s.id}"><div class="ico">${s.i}</div><h3>${esc(s.t)}</h3>
  <div class="muted small">${esc(s.d)}</div>
  <div class="meta"><span class="badge">${CATS[s.cat].t}</span><span class="badge ${s.instant?'done':''}">${s.instant?'Мгновенно':'до '+s.days+' дн.'}</span></div></a>`;
}

function home(){
  const recent = db.items.slice(-3).reverse();
  $('#app').innerHTML = `
  <section class="hero">
    <h1>Обращения и справки — онлайн, без бумаги</h1>
    <p>Подайте обращение, получите справку или отправьте заявление за несколько минут. Документ подписывается электронной подписью и проверяется по коду.</p>
    <form class="search" onsubmit="event.preventDefault();location.hash='#/services?q='+encodeURIComponent(this.q.value)">
      <input name="q" placeholder="Например: справка о составе семьи" aria-label="Поиск услуги">
      <button>Найти</button>
    </form>
    <div class="chips">
      <a href="#/service/appeal">Написать обращение</a><a href="#/service/residence">Справка о регистрации</a><a href="#/service/kindergarten">Запись в детский сад</a>
    </div>
  </section>

  <h2>Категории</h2>
  <div class="grid cat-cards">
    ${Object.entries(CATS).map(([k,c])=>`<a class="card" href="#/services?cat=${k}"><div class="ico">${c.i}</div><h3>${c.t}</h3><div class="muted small">${c.d}</div><div class="meta"><span class="badge">${SERVICES.filter(s=>s.cat===k).length} услуги</span></div></a>`).join('')}
  </div>

  ${recent.length ? `<h2>Последние заявки</h2>${recent.map(itemRow).join('')}<p><a href="#/my">Все заявки →</a></p>` : ''}

  <h2>Как это работает</h2>
  <div class="steps">
    <div class="card"><b>1</b><h3>Выберите услугу</h3><div class="muted small">Обращение, справка или заявление</div></div>
    <div class="card"><b>2</b><h3>Заполните форму</h3><div class="muted small">Данные профиля подставятся автоматически</div></div>
    <div class="card"><b>3</b><h3>Подпишите кодом</h3><div class="muted small">Простая электронная подпись вместо бумажной</div></div>
    <div class="card"><b>4</b><h3>Получите документ</h3><div class="muted small">С кодом проверки — сохраните в PDF или покажите с экрана</div></div>
  </div>

  <h2>Популярные услуги</h2>
  <div class="grid">${['appeal','residence','family','benefit'].map(id=>svcCard(svc(id))).join('')}</div>`;
}

function catalog(cat, q){
  const ql = q.toLowerCase();
  const list = SERVICES.filter(s => (!cat || s.cat===cat) && (!ql || (s.t+' '+s.d).toLowerCase().includes(ql)));
  $('#app').innerHTML = `
  <h1>Услуги</h1>
  <form class="search" style="margin-top:14px" onsubmit="event.preventDefault();location.hash='#/services?${cat?'cat='+cat+'&':''}q='+encodeURIComponent(this.q.value)">
    <input name="q" value="${esc(q)}" placeholder="Поиск услуги" style="border:1px solid var(--line)"><button style="background:var(--brand)">Найти</button>
  </form>
  <div class="tabs">
    <a href="#/services" class="${!cat?'on':''}">Все</a>
    ${Object.entries(CATS).map(([k,c])=>`<a href="#/services?cat=${k}" class="${cat===k?'on':''}">${c.i} ${c.t}</a>`).join('')}
  </div>
  ${list.length ? `<div class="grid">${list.map(svcCard).join('')}</div>` : `<div class="card empty"><h3>Ничего не найдено</h3><p class="muted">Попробуйте изменить запрос</p></div>`}`;
}

function fieldHtml(f, val, prefix){
  const id = prefix+f.n, req = f.opt ? '' : '<span class="req">*</span>';
  let input;
  if (f.t==='select') input = `<select id="${id}" name="${id}">${f.o.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t==='textarea') input = `<textarea id="${id}" name="${id}">${esc(val)}</textarea>`;
  else input = `<input id="${id}" name="${id}" type="${f.t}" value="${esc(val)}" ${f.t==='tel'?'placeholder="+7"':''}>`;
  return `<div class="f"><label for="${id}">${esc(f.l)} ${req}</label>${input}${f.h?`<div class="hint">${esc(f.h)}</div>`:''}</div>`;
}

function serviceForm(id){
  const s = svc(id);
  if (!s) return catalog();
  const p = db.profile;
  const long = s.fields.filter(f=>f.t==='textarea'), short = s.fields.filter(f=>f.t!=='textarea');
  $('#app').innerHTML = `
  <div class="crumbs"><a href="#/services">Услуги</a> / <a href="#/services?cat=${s.cat}">${CATS[s.cat].t}</a></div>
  <h1>${esc(s.t)}</h1>
  <p class="muted">${esc(s.d)}. ${s.instant ? 'Справка будет сформирована сразу после подписания.' : 'Срок рассмотрения — до '+s.days+' дней.'}</p>
  <form class="form" id="sf" novalidate>
    <fieldset><legend>Заявитель</legend>
      <div class="row">${APPLICANT.map(f=>fieldHtml(f, p[f.n]||'', 'a_')).join('')}</div>
      <label class="check"><input type="checkbox" id="saveProfile" checked> Сохранить данные в профиль для следующих заявлений</label>
    </fieldset>
    <fieldset><legend>Сведения</legend>
      <div class="row">${short.map(f=>fieldHtml(f, f.n==='regaddr'?(p.address||''):'', 's_')).join('')}</div>
      ${long.map(f=>fieldHtml(f,'','s_')).join('')}
      <div class="f"><label for="files">Приложения (необязательно)</label><input type="file" id="files" multiple>
      <div class="hint">Сканы и фото документов. В демо-версии сохраняются только названия файлов.</div></div>
    </fieldset>
    <fieldset>
      <label class="check"><input type="checkbox" id="agree"> Подтверждаю достоверность сведений и согласен(на) на обработку персональных данных</label>
      <div class="actions"><button class="btn">Подписать и отправить</button><a class="btn ghost" href="#/services">Отмена</a></div>
    </fieldset>
  </form>`;
  $('#sf').onsubmit = e => { e.preventDefault(); submit(s); };
}

function submit(s){
  const form = $('#sf'); let ok = true, first;
  form.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  const get = (f, pre) => {
    const el = form.elements[pre+f.n], v = el.value.trim();
    let bad = !f.opt && !v;
    if (f.t==='email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) bad = true;
    if (f.t==='tel' && v && v.replace(/\D/g,'').length < 10) bad = true;
    if (f.t==='textarea' && !f.opt && v.length < 20) bad = true;
    if (bad){ ok=false; el.classList.add('bad'); first ||= el; }
    return v;
  };
  const applicant = {}, data = {};
  APPLICANT.forEach(f => applicant[f.n] = get(f,'a_'));
  s.fields.forEach(f => data[f.n] = get(f,'s_'));
  if (!ok){ first.focus(); toast('Проверьте выделенные поля'); return; }
  if (!$('#agree').checked){ toast('Нужно подтвердить согласие'); return; }
  const files = [...$('#files').files].map(f => ({name:f.name, size:f.size}));
  if ($('#saveProfile').checked){ Object.assign(db.profile, applicant); if (data.regaddr) db.profile.address = data.regaddr; save(); }
  signModal(() => {
    const prefix = {appeals:'ОБ', certs:'СП', apps:'ЗЛ'}[s.cat];
    const it = {num: `${prefix}-${new Date().getFullYear()}-${String(Math.floor(Math.random()*1e6)).padStart(6,'0')}`,
                service:s.id, created:Date.now(), applicant, data, files};
    it.code = makeCode(it);
    db.items.push(it); save();
    toast(s.instant ? 'Справка сформирована' : 'Заявка зарегистрирована: '+it.num);
    location.hash = '#/doc/'+encodeURIComponent(it.num);
  });
}

function signModal(done){
  const code = String(Math.floor(1000+Math.random()*9000));
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="card"><h3>Подписание электронной подписью</h3>
    <p class="muted small">Мы отправили код подтверждения. Введите его, чтобы подписать документ простой электронной подписью.</p>
    <input class="code-in" maxlength="4" inputmode="numeric" autocomplete="one-time-code">
    <div class="actions" style="margin-top:16px"><button class="btn" data-ok>Подписать</button><button class="btn ghost" data-x>Отмена</button></div></div>`;
  document.body.append(m);
  const inp = m.querySelector('input'); inp.focus();
  const hint = toast(`🔐 Демо-код подтверждения: <b>${code}</b>`, 60000);
  const go = () => { if (inp.value === code){ m.remove(); hint.remove(); done(); } else { inp.classList.add('bad'); toast('Неверный код'); } };
  m.querySelector('[data-ok]').onclick = go;
  inp.onkeydown = e => { if (e.key==='Enter') go(); };
  m.querySelector('[data-x]').onclick = () => { m.remove(); hint.remove(); };
}

function itemRow(it){
  const s = svc(it.service), st = status(it);
  return `<div class="card item"><div><div class="muted small">${it.num} · ${fmtDT(it.created)}</div><h3 style="margin-top:4px">${s.i} ${esc(s.t)}</h3></div>
    <div style="display:flex;gap:12px;align-items:center"><span class="badge ${st.k}">${st.t}</span><a class="btn ghost" href="#/doc/${encodeURIComponent(it.num)}">Открыть</a></div></div>`;
}

function myList(){
  const items = db.items.slice().reverse();
  $('#app').innerHTML = `<h1>Мои заявки</h1><p class="muted">Обращения, справки и заявления, поданные с этого устройства.</p>
   ${items.length ? items.map(itemRow).join('') : `<div class="card empty"><div class="ico" style="margin:0 auto 12px">📭</div><h3>Пока пусто</h3><p class="muted">Выберите услугу, чтобы подать первое заявление</p><a class="btn" href="#/services">Перейти к услугам</a></div>`}`;
}

function docView(num){
  const it = db.items.find(x => x.num === num);
  if (!it){ $('#app').innerHTML = `<div class="card empty"><h3>Документ не найден</h3><a href="#/my">К списку заявок</a></div>`; return; }
  const s = svc(it.service), st = status(it), a = it.applicant;
  const v = {fio:esc(fio(a)), birth:fmtDate(a.birth)};
  s.fields.forEach(f => v[f.n] = esc(f.t==='date' ? fmtDate(it.data[f.n]) : it.data[f.n]));
  const table = s.fields.filter(f=>f.t!=='textarea').map(f=>`<tr><td>${esc(f.l)}</td><td>${v[f.n]||'—'}</td></tr>`).join('');
  const texts = s.fields.filter(f=>f.t==='textarea' && it.data[f.n]).map(f=>`<p><b>${esc(f.l)}:</b></p><div class="quote">${v[f.n]}</div>`).join('');
  const recipient = it.data.agency ? esc(it.data.agency) : (s.cat==='certs' ? 'Единый центр выдачи справок' : 'Уполномоченный орган');

  let title, body;
  if (s.cat==='certs'){
    title = 'Справка';
    body = s.body(it, v) + `<p>Срок действия справки — 30 дней с даты выдачи (до ${fmtDate(addDays(it.created,30))}).</p>`;
  } else {
    title = s.cat==='appeals' ? 'Электронное обращение' : 'Заявление';
    body = `<table><tr><td>Заявитель</td><td>${v.fio}, ${v.birth} г. р.</td></tr><tr><td>Контакты</td><td>${esc(a.email)}, ${esc(a.phone)}</td></tr>
      <tr><td>Вид</td><td>${esc(s.t)}</td></tr>${table}<tr><td>Срок рассмотрения</td><td>до ${fmtDate(addDays(it.created, s.days))}</td></tr></table>${texts}`;
    if (it.files.length) body += `<p><b>Приложения:</b> ${it.files.map(f=>esc(f.name)).join(', ')}</p>`;
    if (st.step===2) body += `<p><b>${s.cat==='appeals'?'Ответ':'Решение'} (${fmtDate(Date.now())}):</b></p><div class="quote">${
      s.cat==='appeals' ? 'Ваше обращение рассмотрено. По изложенным вопросам приняты меры в пределах компетенции. Дополнительная информация направлена на указанный адрес электронной почты.'
                        : 'По результатам проверки сведений заявление одобрено. Уведомление о дальнейших действиях направлено на указанный адрес электронной почты.'}</div>`;
  }

  const timeline = st.names ? `<div class="card noprint" style="max-width:800px;margin:0 auto 16px"><h3>Статус</h3><ul class="tl" style="margin-top:10px">
     ${st.names.map((n,i)=>`<li class="${!it.withdrawn && i<=st.step?'on':''}">${n}${i===0?` <span class="muted small">— ${fmtDT(it.created)}</span>`:''}</li>`).join('')}
     ${it.withdrawn?'<li>Отозвано заявителем</li>':''}</ul></div>` : '';

  $('#app').innerHTML = `
  <div class="doc-bar noprint">
    <div><a href="#/my">← Мои заявки</a> &nbsp; <span class="badge ${st.k}">${st.t}</span></div>
    <div class="actions" style="margin:0">
      <button class="btn" onclick="print()">⬇ Сохранить PDF / печать</button>
      <button class="btn ghost" id="copyLink">Скопировать код проверки</button>
      ${s.cat!=='certs' && !it.withdrawn && st.step<2 ? '<button class="btn danger" id="withdraw">Отозвать</button>' : ''}
    </div>
  </div>
  ${timeline}
  <article class="sheet">
    <div class="top"><div><b>Цифровая приёмная</b><br>Электронный документ</div><div style="text-align:right">Кому: ${recipient}<br>От: ${v.fio}</div></div>
    <h2>${title}</h2>
    <div class="num">№ ${it.num} от ${fmtDate(it.created)}</div>
    ${body}
    <div class="sign">${qr(it.code)}<div><b>ДОКУМЕНТ ПОДПИСАН ПРОСТОЙ ЭЛЕКТРОННОЙ ПОДПИСЬЮ</b>
      Подписант: ${v.fio}<br>Дата и время: ${fmtDT(it.created)}<br>Код проверки: <b style="display:inline;font-size:15px">${it.code}</b><br>
      Проверить подлинность: раздел «Проверить документ»</div></div>
  </article>`;

  $('#copyLink').onclick = () => {
    const t = `${it.num} / ${it.code}`;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('Скопировано: '+t), ()=>toast(t, 8000));
  };
  const w = $('#withdraw');
  if (w) w.onclick = () => { if (confirm('Отозвать заявку? Это действие нельзя отменить.')){ it.withdrawn = true; save(); toast('Заявка отозвана'); docView(num); } };
}

function verify(n, c){
  $('#app').innerHTML = `<h1>Проверка подлинности документа</h1>
  <p class="muted">Введите номер документа и код проверки из блока электронной подписи.</p>
  <form class="form" id="vf"><fieldset><div class="row">
    <div class="f"><label for="vn">Номер документа</label><input id="vn" value="${esc(n)}" placeholder="СП-2026-000000"></div>
    <div class="f"><label for="vc">Код проверки</label><input id="vc" value="${esc(c)}" placeholder="XXXX-XXXX-XXXX"></div>
  </div><button class="btn">Проверить</button></fieldset></form><div id="vr" class="form"></div>`;
  const check = () => {
    const num = $('#vn').value.trim().toUpperCase(), code = $('#vc').value.trim().toUpperCase();
    if (!num) return;
    const it = db.items.find(x => x.num.toUpperCase() === num);
    const valid = it && it.code === code && makeCode(it) === it.code;
    $('#vr').innerHTML = valid
      ? `<div class="card" style="border-color:var(--ok);background:var(--ok-soft)"><h3 style="color:var(--ok)">✔ Документ подлинный</h3>
         <p>${esc(svc(it.service).t)}<br>Заявитель: ${esc(fio(it.applicant))}<br>Подписан: ${fmtDT(it.created)}<br>Статус: ${status(it).t}</p>
         <a href="#/doc/${encodeURIComponent(it.num)}">Открыть документ →</a></div>`
      : `<div class="card" style="border-color:#f0c9c9;background:#fff6f6"><h3 style="color:var(--err)">✖ Документ не найден или код неверен</h3>
         <p class="muted small">Проверьте правильность номера и кода. В демо-версии проверяются документы, созданные в этом браузере.</p></div>`;
  };
  $('#vf').onsubmit = e => { e.preventDefault(); check(); };
  if (n) check();
}

function profile(){
  const p = db.profile;
  $('#app').innerHTML = `<h1>Профиль</h1><p class="muted">Эти данные подставляются в формы автоматически. Хранятся только в этом браузере.</p>
  <form class="form" id="pf"><fieldset><legend>Личные данные</legend>
    <div class="row">${APPLICANT.map(f=>fieldHtml({...f,opt:true}, p[f.n]||'', 'p_')).join('')}</div>
    ${fieldHtml({n:'address',l:'Адрес регистрации',t:'text',opt:true}, p.address||'', 'p_')}
    <div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn danger" id="wipe">Удалить все данные</button></div>
  </fieldset></form>
  <div class="card form"><h3>Статистика</h3><p class="muted" style="margin:0">Подано: ${db.items.length} · Справок: ${db.items.filter(i=>svc(i.service).cat==='certs').length} · Обращений: ${db.items.filter(i=>svc(i.service).cat==='appeals').length}</p></div>`;
  $('#pf').onsubmit = e => { e.preventDefault(); [...APPLICANT,{n:'address'}].forEach(f => db.profile[f.n] = $('#p_'+f.n).value.trim()); save(); toast('Профиль сохранён'); };
  $('#wipe').onclick = () => { if (confirm('Удалить профиль и все заявки с этого устройства?')){ db = {profile:{}, items:[]}; save(); toast('Данные удалены'); profile(); } };
}

/* псевдо-QR из кода проверки (декоративный) */
function qr(seed){
  const N = 25; let h = parseInt(seed.replace(/-/g,'').slice(0,8),16) || 1;
  const rnd = () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return (h>>>0)/4294967296 };
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  let r = '';
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    if ((x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8)) continue;
    if (rnd() > .5) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges" fill="#0a2f6e"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

route();
